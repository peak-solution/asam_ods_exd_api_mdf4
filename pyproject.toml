[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["external_data_file"]

[project]
name = "asam-ods-exd-api-mdf4"
version = "1.0.0"
description = "ASAM ODS EXD API implementation to read external data from MDF4 files."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "peak-solution"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "asammdf>=7.0.0",
    "ods-exd-api-box>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "isort>=5.12",
    "jupyterlab>=4.0",
    "mypy>=1.5",
    "black>=23.0",
    "flake8",
    "flake8-pyproject",
]

[project.urls]
Homepage = "https://github.com/peak-solution/asam_ods_exd_api_mdf4"

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
]

[tool.pylint.format]
max-line-length = 119

[tool.black]
line-length = 119
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.flake8]
extend-ignore = ["E203"]
max-line-length = 119
exclude = [".venv", "__pycache__", "build", "*.egg-info"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
exclude = '(^|/)(build|\.venv|\.mypy_cache)(/|$)'

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "asammdf.*"
ignore_missing_imports = true
