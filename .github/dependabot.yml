version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "dev"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "dev"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "dev"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
